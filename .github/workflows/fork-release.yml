# Fork-only: build the Windows client from a given upstream tag and publish it
# as a release on THIS fork. The self-updater is repointed at this fork at
# build time (not committed) so upstream merges never conflict.
name: Fork release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. 0.1.61)'
        required: true
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check tag input
        run: |
          echo "Building tag: '${{ inputs.tag }}'"
          test -n "${{ inputs.tag }}" || { echo "::error::No tag was passed to this workflow"; exit 1; }

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Point self-updater at this fork
        run: |
          sed -i 's|UpdateGithubOwner: "ao-data"|UpdateGithubOwner: "${{ github.repository_owner }}"|; s|UpdateGithubRepo:  "albiondata-client"|UpdateGithubRepo:  "${{ github.event.repository.name }}"|' client/config.go
          grep -n 'UpdateGithub' client/config.go | sed -n 3,4p

      - name: Build Windows
        env:
          GITHUB_REF_NAME: ${{ env.TAG }}
        run: make build-windows

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="albiondata-client.exe update-windows-amd64.exe.gz albiondata-client-amd64-installer.exe"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "$TAG" \
              --notes "Windows build of upstream ao-data/albiondata-client $TAG"
          fi
