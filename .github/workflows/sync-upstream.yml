# Fork-only: keep master in sync with ao-data/albiondata-client and build a
# release for each new upstream tag.
#
# Optional secret SYNC_TOKEN: a personal access token with repo + workflow
# scope. Needed only when upstream changes files under .github/workflows
# (the default token is not allowed to push those).
name: Sync upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.sync.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        id: sync
        run: |
          git config user.name "fork-sync[bot]"
          git config user.email "fork-sync@users.noreply.github.com"
          git remote add upstream https://github.com/ao-data/albiondata-client.git
          git fetch upstream --tags --force
          before=$(git tag | sort)
          if ! git merge upstream/master --no-edit; then
            echo "::error::Merge conflict with upstream/master. Resolve locally: git fetch upstream && git merge upstream/master"
            exit 1
          fi
          git push origin HEAD:master
          # Only push the newest upstream tag: older tags point at commits that
          # contain workflow files, which the default token may not push.
          latest=$(git tag --list '[0-9]*' | sort -V | tail -1)
          git push origin "refs/tags/$latest"
          # build a release for the newest tag if this fork has none yet
          new=""
          gh release view "$latest" >/dev/null 2>&1 || new="$latest"
          echo "new_tag=$new" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    needs: sync
    if: needs.sync.outputs.new_tag != ''
    uses: ./.github/workflows/fork-release.yml
    with:
      tag: ${{ needs.sync.outputs.new_tag }}
